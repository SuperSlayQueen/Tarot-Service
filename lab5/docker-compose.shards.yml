# Lab 5 — шардирование: несколько независимых экземпляров PostgreSQL.
#
# Запуск трёх шардов:
#   docker compose -f lab5/docker-compose.shards.yml up -d
# Добавление четвёртого шарда (задание 5: 3 shards -> 4 shards):
#   docker compose -f lab5/docker-compose.shards.yml --profile four up -d
# Остановка одного шарда (задание lab6 «Отказ одного shard»):
#   docker stop lab5_shard2
# Полная очистка:
#   docker compose -f lab5/docker-compose.shards.yml --profile four down -v
#
# Порты хоста: shard0 = 5441, shard1 = 5442, shard2 = 5443, shard3 = 5444
# Внутри docker-сети имена хостов: shard0, shard1, shard2, shard3
# БД/пользователь/пароль на всех шардах: tarot_shard / tarot / tarot

x-shard: &shard
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: tarot_shard
    POSTGRES_USER: tarot
    POSTGRES_PASSWORD: tarot
  command:
    - postgres
    - -c
    - max_connections=200
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U tarot -d tarot_shard"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  shard0:
    <<: *shard
    container_name: lab5_shard0
    ports:
      - "5441:5432"
    volumes:
      - lab5_shard0_data:/var/lib/postgresql/data

  shard1:
    <<: *shard
    container_name: lab5_shard1
    ports:
      - "5442:5432"
    volumes:
      - lab5_shard1_data:/var/lib/postgresql/data

  shard2:
    <<: *shard
    container_name: lab5_shard2
    ports:
      - "5443:5432"
    volumes:
      - lab5_shard2_data:/var/lib/postgresql/data

  # Четвёртый шард — только с профилем "four"
  shard3:
    <<: *shard
    container_name: lab5_shard3
    ports:
      - "5444:5432"
    volumes:
      - lab5_shard3_data:/var/lib/postgresql/data
    profiles: ["four"]

volumes:
  lab5_shard0_data:
  lab5_shard1_data:
  lab5_shard2_data:
  lab5_shard3_data:

networks:
  default:
    name: lab5_shards
